name: Update Homebrew Cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to trigger update for (e.g., v2.0.2)'
        required: true

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use input tag_name if run manually, else fallback to release event tag
          TAG_NAME="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"
          echo "Target Tag: $TAG_NAME"
          mkdir -p dist
          gh release download "$TAG_NAME" --pattern "*.dmg" --dir dist

      - name: Generate and Update Cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Use input tag_name if run manually, else fallback to release event tag
          TAG_NAME="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"
          
          # 1. Locate the DMG file
          DMG_PATH=$(find dist -maxdepth 1 -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "Error: DMG file not found in dist/"
            exit 1
          fi
          DMG_FILENAME=$(basename "$DMG_PATH")
          echo "Found DMG: $DMG_FILENAME"

          # 2. Calculate SHA256 checksum
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{ print $1 }')
          echo "SHA256: $SHA256"

          # 3. Retrieve version (remove leading 'v' from tag name)
          VERSION="${TAG_NAME#v}"
          echo "Version: $VERSION"

          # 4. Prepare URL Filename for Homebrew Cask (URL-encoded and uses #{version})
          URL_FILENAME="${DMG_FILENAME// /%20}"
          URL_FILENAME=$(echo "$URL_FILENAME" | sed "s/$VERSION/#{version}/g")
          echo "URL Filename for Cask: $URL_FILENAME"

          # 5. Clone homebrew-tap
          git clone https://x-access-token:${TAP_TOKEN}@github.com/pocket-planner/homebrew-tap.git homebrew-tap
          mkdir -p homebrew-tap/Casks

          # 6. Generate the Cask formula directly inline
          cat <<EOF > homebrew-tap/Casks/pocket-planner.rb
cask "pocket-planner" do
  version "${VERSION}"
  sha256 "${SHA256}"

  url "https://github.com/pocket-planner/desktop-app-releases/releases/download/v#{version}/${URL_FILENAME}"
  name "Pocket Planner"
  desc "A minimal desktop app for weekly task planning"
  homepage "https://github.com/pocket-planner/desktop-app"

  app "Pocket Planner.app"

  caveats <<~EOS
    Because this app is self-signed/unsigned, you may need to clear the quarantine attribute after installation:
      xattr -cr "/Applications/Pocket Planner.app"
  EOS

  zap trash: [
    "~/Library/Application Support/pocket-planner",
    "~/Library/Application Support/pocket-planner-dev",
    "~/Library/Preferences/com.pocketplanner.desktop.plist",
    "~/Library/Saved Application State/com.pocketplanner.desktop.savedState",
  ]
end
EOF

          # 7. Commit and Push to Tap
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pocket-planner.rb
          git commit -m "bump: pocket-planner to v${VERSION}" || echo "No changes to commit"
          git push origin HEAD
